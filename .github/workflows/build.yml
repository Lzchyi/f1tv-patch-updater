name: Check Android TV app
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and run host checks
        run: gradle --no-daemon assembleCommunityDebug testCommunityDebugUnitTest lintCommunityDebug
      - uses: actions/upload-artifact@v4
        with:
          name: community-ci-debug-apk
          path: app/build/outputs/apk/community/debug/app-community-debug.apk
          if-no-files-found: error
