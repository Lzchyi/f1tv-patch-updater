plugins { id 'com.android.application' }

android {
    namespace 'com.independent.f1tvupdater'
    compileSdk 35

    defaultConfig {
        applicationId 'com.independent.f1tvupdater'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
